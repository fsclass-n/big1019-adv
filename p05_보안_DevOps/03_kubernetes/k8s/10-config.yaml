# 설정(ConfigMap)과 비밀 값(Secret)을 코드·이미지와 분리
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: edu
data:
  GREETING: "쿠버네티스에서 실행 중"
  REDIS_URL: "redis://redis:6379/0"

# 비밀 값(Secret)은 YAML(=Git)에 쓰지 않고 .env 파일에서 만든다:
#   cp .env.example .env   (값 입력, .env 는 Git 제외)
#   kubectl create secret generic app-secret -n edu --from-env-file=.env
# Secret은 base64 인코딩일 뿐 암호화가 아닙니다. 실무에서는 External Secrets,
# Sealed Secrets, AWS Secrets Manager 등을 사용하세요.
