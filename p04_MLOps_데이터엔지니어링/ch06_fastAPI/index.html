<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>FastAPI + SQLAlchemy 회원 관리</title>
<style>
  body { font-family: 'Malgun Gothic', sans-serif; max-width: 720px; margin: 30px auto; padding: 0 16px; color: #222; }
  input, button { padding: 8px; font-size: 14px; }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; }
  th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
  th { background: #dce6f2; }
  pre { background: #f6f8fa; padding: 10px; border-radius: 6px; white-space: pre-wrap; font-size: 13px; }
  .muted { color: #888; font-size: 13px; }
</style>
</head>
<body>
<h1>회원 관리 <small class="muted">FastAPI + SQLAlchemy (ex02_sqlalchemy.py)</small></h1>

<input type="text" id="name" placeholder="이름" aria-label="이름">
<label for="email">이메일</label>
<input type="email" id="email" placeholder="이메일">
<button id="btnCreate">등록 (POST /users/)</button>
<button id="btnLoad">새로고침 (GET /users/)</button>

<h3>서버 응답</h3>
<pre id="response">-</pre>

<h3>회원 목록</h3>
<table><thead><tr><th>id</th><th>이름</th><th>이메일</th></tr></thead><tbody id="users"></tbody></table>
<p class="muted">API 문서: <a href="/docs" target="_blank">/docs</a></p>

<script type="module">
const $ = id => document.getElementById(id);
/* 
    function $(id) {
      return document.getElementById(id);
    }
*/


// 1. 사용자 등록
// - 이름과 이메일을 서버에 전송
// - POST 요청
// async는 비동기 함수
// - 비동기 처리를 사용하는 이유는 서버에 데이터를 전송하고 응답을 기다리는 동안 브라우저 화면이 멈추지 않도록 하기 위해서
async function createUser() {
  // ex02 의 create_user(name: str, email: str) 는 쿼리 매개변수로 값을 받는다
  // (1) 입력값을 URL 매개변수로 변환
  // URLSearchParams(): 객체 형태의 데이터를 URL 쿼리 문자열로 변환하는 JavaScript 내장 객체
  const params = new URLSearchParams({ 
    name: $('name').value, 
    email: $('email').value
  });

  // (2) 서버에 POST 요청 전송
  // fetch(): HTTP 요청을 보내는 JavaScript 함수
  // 예) POST /users/?name=홍길동&email=hong%40test.com
  // 실제 요청에서는 한글이 URL 인코딩됩니다.
  // 예) name=%ED%99%8D%EA%B8%B8%EB%8F%99&email=hong%40test.com
  // await: 서버의 응답이 도착할 때까지 해당 함수의 다음 코드 실행을 기다립니다.
  const res = await fetch('/users/?' + params, {
    method: 'POST'
  });

  // (3) 서버 응답 화면 출력
  // res.status: 상태 코드
  // await res.json(): 서버가 반환한 JSON 응답 본문을 JavaScript 객체로 변환
  // JSON.stringify(객체, replacer, space): JavaScript 객체를 JSON 문자열로 변환
  // - 첫 번째: 변환할 객체
  // - 두 번째: 변환할 속성 선택 함수 또는 배열 (null이면 기본 변환)
  // - 세 번째: 들여쓰기 공백 수 (2이면 2칸)
  $('response').textContent = `POST /users/?${params} → ${res.status}\n` + JSON.stringify(await res.json(), null, 2);

  // (4) 등록 성공 시 입력창 초기화 및 사용자 목록 조회
  if (res.ok) {
    $('name').value = ''; 
    $('email').value = ''; 
    loadUsers(); 
  }
}

// 2. 사용자 조회
// - GET 요청
// - 서버에서 사용자 목록 가져오기
async function loadUsers() {
  // (1) GET 요청
  // GET /users/
  const users = await (await fetch('/users/')).json();
  /* 
    const response = await fetch('/users/');
    const users = await reponse.json();
  */

  // (2) 기존 사용자 목록 삭제
  // - HTML에서 users라는 ID를 가진 요소의 기존 내용을 모두 삭제
  $('users').innerHTML = '';

  // (3) 사용자 배열 반복 처리
  // forEach(): 배열에 들어 있는 데이터를 하나씩 반복하는 함수
  // - u는 현재 처리 중인 사용자 한 명을 의미한다.
  users.forEach(u => {
    // (4) 테이블 행 생성
    const tr = document.createElement('tr');
    // (5) 사용자 정보를 테이블 셀에 입력
    [u.id, u.name, u.email].forEach(v => { 
      // td 생성
      const td = document.createElement('td'); 
      // 셀에 데이터 입력
      td.textContent = v; 
      // tr에 td 추가
      tr.appendChild(td); 
    });
    // 테이블에 행 추가
    $('users').appendChild(tr);
  });

  /* 
    users.forEach(function(u){
      // 사용자 한 명씩 처리
    });
  */


}

  // 3. 버튼에 이벤트 연결
  $('btnCreate').addEventListener('click', createUser);
  $('btnLoad').addEventListener('click', loadUsers);

  // 최초 페이지 로딩 시 사용자 조회
  await loadUsers();
</script>
</body>
</html>
